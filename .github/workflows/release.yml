name: Prototype release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  package:
    runs-on: windows-2022
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: '8.0.x'
      - name: Validate version tag
        id: version
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if ($env:RELEASE_TAG -notmatch '^v(\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?)$') { throw 'Expected vMAJOR.MINOR.PATCH[-prerelease]' }
          "version=$($Matches[1])" >> $env:GITHUB_OUTPUT
      - name: Build and check release
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: ./scripts/Build.ps1 -WithAddIn -Version $env:RELEASE_VERSION
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: release-assets
          path: artifacts/${{ steps.version.outputs.version }}/release/*
          if-no-files-found: error
  release:
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8.0.1
        with:
          name: release-assets
          path: release
      - name: Create draft prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_VERSION: ${{ needs.package.outputs.version }}
        run: |
          mapfile -d '' assets < <(find release -type f -print0)
          if [ "${#assets[@]}" -ne 3 ]; then
            echo "Expected setup, portable ZIP and SHA256SUMS.txt"
            exit 1
          fi
          if gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft > release-state.txt 2>/dev/null; then
            if [ "$(cat release-state.txt)" != "true" ]; then
              echo "Refusing to modify a published release"
              exit 1
            fi
            gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
          else
            gh release create "$RELEASE_TAG" "${assets[@]}" --verify-tag --draft --prerelease --title "MechCue $RELEASE_VERSION" --generate-notes
          fi
