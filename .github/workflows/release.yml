name: Prototype release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  package:
    runs-on: windows-2022
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Validate version tag
        id: version
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if ($env:RELEASE_TAG -notmatch '^v(\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?)$') { throw 'Expected vMAJOR.MINOR.PATCH[-prerelease]' }
          "version=$($Matches[1])" >> $env:GITHUB_OUTPUT
      - name: Build and check release
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: ./scripts/Build.ps1 -WithAddIn -Version $env:RELEASE_VERSION
      - uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: artifacts/*/release/*
          if-no-files-found: error
  release:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: release
      - name: Create draft prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_VERSION: ${{ needs.package.outputs.version }}
        run: |
          gh release create "$RELEASE_TAG" release/* --verify-tag --draft --prerelease --title "MechCue $RELEASE_VERSION" --generate-notes
