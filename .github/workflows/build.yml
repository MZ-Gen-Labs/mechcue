name: Build and test
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: '8.0.x'
      - name: Verify Python test runtime
        shell: pwsh
        run: python --version
      - name: Prepare Inno Setup compiler
        shell: pwsh
        run: ./scripts/Setup-InnoCI.ps1
      - name: Build, test and package both editions
        shell: pwsh
        run: ./scripts/Build.ps1 -WithAddIn -WithMcp
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: MechCue-prototype
          path: artifacts/*/release/*
          if-no-files-found: error
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: test-reports
          path: |
            artifacts/*/standalone/*test-result.txt
            artifacts/*/standalone/preview.png
            artifacts/*/installer/installer-test-result.txt
            artifacts/*/installer-addin/installer-test-result.txt
          if-no-files-found: ignore
